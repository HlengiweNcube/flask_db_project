<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="African Fashion Showcase Website">
    <title>African Fashion</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>


<div class="page-container">

<header class="banner">
    <h1>African Fashion</h1>
</header>

<nav class="navbar">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('gallery') }}">Gallery</a>
    <a href="{{ url_for('add') }}">Add Outfit</a>
    <a href="{{ url_for('contact') }}">Contact</a>
    <a href="{{ url_for('about') }}">About</a>
    {% if current_user.is_authenticated %}
        <a href="{{ url_for('categories') }}">Manage Categories and Images</a>
        <span>Signed in as {{ current_user.username }}</span>
        <form method="POST" action="{{ url_for('logout') }}" class="logout-form">
            <button type="submit">Log out</button>
        </form>
    {% else %}
        <a href="{{ url_for('login') }}">Log in</a>
        <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>&copy; 2026 African Fashion</p>
</footer>

</div>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
