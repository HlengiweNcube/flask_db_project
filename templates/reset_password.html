{% extends "base.html" %}

{% block content %}
<h1>Choose a new password</h1>
{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
<form method="POST">
    <label for="password">New password (minimum 8 characters):</label><br>
    <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password"><br><br>

    <label for="confirmation">Confirm new password:</label><br>
    <input id="confirmation" type="password" name="confirmation" required minlength="8" autocomplete="new-password"><br><br>

    <button type="submit" class="btn-black">Set new password</button>
</form>
{% endblock %}
