{% extends "base.html" %}

{% block content %}
<h1>Reset your password</h1>
{% if sent %}
<p class="form-success" role="status">If an account uses that email address, a password reset link has been sent.</p>
{% else %}
<form method="POST" action="{{ url_for('forgot_password') }}">
    <label for="email">Email address:</label><br>
    <input id="email" type="email" name="email" required autocomplete="email"><br><br>
    <button type="submit" class="btn-black">Email reset link</button>
</form>
{% endif %}
<p><a href="{{ url_for('login') }}">Back to log in</a></p>
{% endblock %}
