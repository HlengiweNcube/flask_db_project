{% extends "base.html" %}

{% block content %}

<h1>Add Outfit</h1>

{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

 <form method="POST" action="{{ url_for('add') }}" novalidate>

    <label for="name">Outfit name <span title="The name of the clothing item">(i)</span>:</label><br>
    <input id="name" type="text" name="name" placeholder="e.g. Xhosa Wedding Dress" required><br><br>

    <label for="category">Category:</label><br>
    <select id="category" name="category" required>
        <option value="" selected disabled>Choose a category</option>
        {% for category in categories %}
            <option value="{{ category }}">{{ category }}</option>
        {% endfor %}
    </select>
    <br><br>

    <label>Description:</label><br>
    <textarea name="description"></textarea><br><br>

    <label for="image_url">Image:</label><br>
    <select id="image_url" name="image_url" required>
        <option value="" selected disabled>Choose an image</option>
        {% for image in images %}
            <option value="{{ image }}">{{ image }}</option>
        {% endfor %}
    </select><br><br>

    <!-- ✅ QUANTITY FIELD -->
    <label>Quantity:</label><br>
    <input type="number" name="quantity" min="0" required><br><br>

    <!-- ✅ PRICE FIELD -->
    <label>Price (€):</label><br>
    <input type="number" step="0.01" name="price" min="0" required><br><br>

    <!-- ✅ BUTTON -->
    <button type="submit" class="btn-black">Add Outfit</button>

</form>

{% endblock %}
