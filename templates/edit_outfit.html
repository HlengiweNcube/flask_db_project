{% extends "base.html" %}

{% block content %}
<h1>Edit Outfit</h1>

{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}

 <form method="POST" action="{{ url_for('edit_outfit', id=outfit.id) }}">
    <label>Name:</label><br>
    <input type="text" name="name" value="{{ outfit.name }}" required><br><br>

    <label>Category:</label><br>
    <input list="category-list" name="category" value="{{ outfit.category_name }}" required>
    <datalist id="category-list">
        {% for cat in categories %}
            <option value="{{ cat.name }}">
        {% endfor %}
    </datalist>
    <br><br>

    <label>Description:</label><br>
    <textarea name="description">{{ outfit.description }}</textarea><br><br>
    <label>Image URL:</label><br>
    <input type="text" name="image_url" value="{{ outfit.image_url }}"><br><br>

    <label>Quantity:</label><br>
    <input type="number" name="quantity" value="{{ outfit.quantity }}" min="0"><br><br>

    <label>Price (€):</label><br>
    <input type="number" step="0.01" name="price" value="{{ outfit.price }}" min="0"><br><br>

    <button type="submit">Update</button>
</form>

{% endblock %}
